[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultd"
version = "1.2.1"
description = "AES-256-GCM + Argon2id encrypted crypto portfolio context for AI agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["crypto", "portfolio", "encryption", "argon2", "aes-gcm", "ai", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
    "jsonschema>=4.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4.0",
    "mypy>=1.10",
]

[project.scripts]
vaultd-save = "vaultd.cli.save:main"
vaultd-load = "vaultd.cli.load:main"

[project.entry-points."vaultd.plugins"]
core = "vaultd.core"

[project.urls]
Homepage = "https://github.com/Davincc77/vaultd"
Repository = "https://github.com/Davincc77/vaultd"
"Bug Tracker" = "https://github.com/Davincc77/vaultd/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["vaultd*"]

[tool.setuptools.package-data]
vaultd = ["../schemas/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["scripts"]
omit = ["tests/*"]
